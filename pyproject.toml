[project]
name = "caldacerta"
version = "1.0.0"
description = "Calda Certa: balanceamento de sorvetes, gelatos e sorbets (biblioteca + CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
calda = "caldacerta.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caldacerta"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
